services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: threatintel
      POSTGRES_USER: threatintel
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-nur_lokal_aendern}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatintel"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      Database__Provider: Postgres
      ConnectionStrings__ThreatIntel: "Host=postgres;Database=threatintel;Username=threatintel;Password=${POSTGRES_PASSWORD:-nur_lokal_aendern}"
      Ingest__ApiKey: "${INGEST_API_KEY:-lokaler-entwicklungsschluessel}"
      Llm__BaseUrl: "${LLM_BASE_URL:-}"
      Llm__ApiKey: "${LLM_API_KEY:-}"
    ports:
      - "5000:8080"

  collector:
    build: ./collector
    depends_on: [ api ]
    environment:
      THREATINTEL_URL: http://api:8080
      THREATINTEL_API_KEY: "${INGEST_API_KEY:-lokaler-entwicklungsschluessel}"
      NVD_API_KEY: "${NVD_API_KEY:-}"
    command: ["python", "-m", "collector", "--days", "7", "--interval", "60"]
    restart: on-failure

  web:
    build: ./web
    depends_on: [ api ]
    ports:
      - "8080:80"

volumes:
  pgdata:
