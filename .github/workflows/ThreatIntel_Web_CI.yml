name: ThreatIntel_Web_CI.yml

on: 
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - '.github/workflows/ThreatIntel_Web_CI.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'web/**'
      - '.github/workflows/ThreatIntel_Web_CI.yml'

jobs:
  web:
    name: Oberfläche (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build  