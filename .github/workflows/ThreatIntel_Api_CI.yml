name: ThreatIntel_Api_CI.yml

on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'collector/**'
      - '.github/workflows/ThreatIntel_Api_CI.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'collector/**'
      - '.github/workflows/ThreatIntel_Api_CI.yml'

jobs:
  api-build:
    name: API-Build (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/ThreatIntel.Api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build ThreatIntel.Api.csproj -c Release

  api-test:
    name: API-Test (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/ThreatIntel.Tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test ThreatIntel.Tests.csproj -c Release

  collector:
    name: Sammler (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -v
